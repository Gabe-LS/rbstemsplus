# deps.lock: every file a Windows build downloads, with its SHA-256, and the licence of each part
# we use (release.md §9.1). Read by scripts/deps.sh (one awk reader, no JSON tool):
# `deps.sh fetch NAME` and `deps.sh group NAME DIR` are the one way the Windows builds download,
# `deps.sh licence NAME DIR` checks a component's licence files, `deps.sh check` (make check) is
# the offline gate.
#
# Stanzas are separated by a blank line; `key = value` lines; `#` starts a comment line. Two kinds:
#  - a download record: what is fetched (kind = archive | file), its url (https only) and sha256;
#    group = a name for files fetched together into one folder (`deps.sh group`);
#  - a component record, named <download>.<part>: one way we use a part of a download. from = the
#    download (or downloads) it comes from; use = ships | links | build | test; spdx; licence-file
#    (paths inside the download, or the file itself) with licence-sha256 in the same order
#    (licence-from = the download holding them, when that isn't `from`); notice = the NOTICE or
#    win/NOTICE.txt heading that covers it, or none (why).
#
# The Mac's pins stay where they are (bridge/build.sh FLAC_*, helper/build.sh SQLCIPHER_* and
# PYREKORDBOX_*, scripts/win-cc.sh LLVM_MINGW_*): their rows here hold the same values and
# `deps.sh check` compares the two, so the Mac files don't move (release.md §9.1).
#
# Not here yet (release.md T1-T6): pocketfft and BlocksRuntime, which scripts/win-deps.sh fetches
# with its own pins, and the .NET and NuGet rows.

