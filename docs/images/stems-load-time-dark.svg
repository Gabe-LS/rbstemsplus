<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="Time until a 6½-minute track's stems are ready" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Time until a 6½-minute track's stems are ready</title>
<line x1="250.0" x2="250.0" y1="22" y2="182" stroke="#656c76" stroke-width="1"/>
<text x="250.0" y="200" font-size="12" text-anchor="middle" fill="#9198a1">0 s</text>
<line x1="355.0" x2="355.0" y1="22" y2="182" stroke="#3d444d" stroke-width="1"/>
<text x="355.0" y="200" font-size="12" text-anchor="middle" fill="#9198a1">20 s</text>
<line x1="460.0" x2="460.0" y1="22" y2="182" stroke="#3d444d" stroke-width="1"/>
<text x="460.0" y="200" font-size="12" text-anchor="middle" fill="#9198a1">40 s</text>
<line x1="565.0" x2="565.0" y1="22" y2="182" stroke="#3d444d" stroke-width="1"/>
<text x="565.0" y="200" font-size="12" text-anchor="middle" fill="#9198a1">60 s</text>
<line x1="670.0" x2="670.0" y1="22" y2="182" stroke="#3d444d" stroke-width="1"/>
<text x="670.0" y="200" font-size="12" text-anchor="middle" fill="#9198a1">80 s</text>
<text x="238" y="45" font-size="14" font-weight="600" text-anchor="end" fill="#f0f6fc">rekordbox's own model</text>
<text x="238" y="62" font-size="12" text-anchor="end" fill="#9198a1">every time you load the track</text>
<path d="M250,30 H382.5 Q386.5,30 386.5,34 V60 Q386.5,64 382.5,64 H250 Z" fill="#3987e5"/>
<text x="394.5" y="52" font-size="14" font-weight="600" fill="#f0f6fc">about 26 s</text>
<text x="238" y="101" font-size="14" font-weight="600" text-anchor="end" fill="#f0f6fc">Stems Plus, first load</text>
<text x="238" y="118" font-size="12" text-anchor="end" fill="#9198a1">the track is separated</text>
<path d="M250,86 H650.25 Q654.25,86 654.25,90 V116 Q654.25,120 650.25,120 H250 Z" fill="#d95926"/>
<text x="662.25" y="108" font-size="14" font-weight="600" fill="#f0f6fc">about 77 s</text>
<text x="238" y="157" font-size="14" font-weight="600" text-anchor="end" fill="#f0f6fc">Stems Plus, next loads</text>
<text x="238" y="174" font-size="12" text-anchor="end" fill="#9198a1">with Stems Cache</text>
<path d="M250,142 H282.75 Q286.75,142 286.75,146 V172 Q286.75,176 282.75,176 H250 Z" fill="#199e70"/>
<text x="294.75" y="164" font-size="14" font-weight="600" fill="#f0f6fc">about 7 s</text>
<text x="16" y="236" font-size="12" fill="#9198a1">Time until the stems of a 6½-minute track are ready, timed in rekordbox on an Apple Silicon Mac.</text>
</svg>
